name: CI/CD Strength Tracker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: strengthapp-store/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify bundle integrity
        run: npm run build:check

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Sync Capacitor
        run: npm run sync

  android-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: strengthapp-store/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npm run sync

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -x lint

      - name: Verify AAB output
        run: |
          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_FILE" ]; then
            echo "AAB size: $(du -h $AAB_FILE | cut -f1)"
            echo "Build verification PASSED"
          else
            echo "ERROR: AAB not found at $AAB_FILE"
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
