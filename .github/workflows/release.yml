name: Build Release AAB

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.1.0)'
        required: false
        type: string

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/strengthapp-release.jks
          cat > android/keystore.properties << EOF
          storeFile=../keystore/strengthapp-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=strengthapp
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon -PversionName="${{ github.event.inputs.version || github.event.release.tag_name || '1.1.0' }}"

      - name: Verify AAB
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "AAB not found at $AAB_PATH"
            exit 1
          fi
          echo "AAB size: $(du -h $AAB_PATH | cut -f1)"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload AAB to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/bundle/release/app-release.aab