<body class="dark"><div id="app"></div><div id="toast">Notificación</div>
<script>
/**
 * ============================================================================
 * STRENGTH TRACKER — GUÍA DE ARQUITECTURA & ÍNDICE PARA DESARROLLO / LLMs
 * ============================================================================
 * 
 * 🗺️ ÍNDICE DE SECCIONES DEL ARCHIVO:
 * ----------------------------------------------------------------------------
 *  [SEC-01] CONSTANTES & CONFIGURACIÓN GLOBAL
 *           -> Claves de localStorage, versión de esquema DB, límites.
 * 
 *  [SEC-02] MODELO DE DATOS & ESTADO REACTIVO
 *           -> Estructura de `db` (weeks -> sessions -> exercises -> sets)
 *           -> Objeto `state` (view, activeWeekId, modal, conflictQueue).
 * 
 *  [SEC-03] UTILIDADES, SANITIZACIÓN & ALMACENAMIENTO (utils)
 *           -> utils.esc(): Sanitización XSS obligatoria para innerHTML.
 *           -> utils.encodeParam(): Codificación para atributos inline/onclick.
 *           -> utils.save() / utils.load(): Persistencia con control de cuota.
 *           -> utils.migrateSchema(): Migraciones automáticas v1 -> v2.
 *           -> utils.download() / utils.downloadCSV(): Exportación Web/Capacitor.
 * 
 *  [SEC-04] VALIDACIÓN EXHAUSTIVA & SANITIZACIÓN DE ENTRADA (validate)
 *           -> validate.json(): Valida semanas importadas.
 *           -> validate.backupJSON(): Valida y normaliza copias de seguridad.
 *           -> validate.sanitizeWeekObject(): Rellena valores por defecto y tipos.
 * 
 *  [SEC-05] MOTOR DE COPIAS DE SEGURIDAD (backup)
 *           -> backup.auto(): Guardado rotativo de los últimos 5 backups diarios.
 *           -> backup.restore(), backup.downloadAll(), etc.
 * 
 *  [SEC-06] MOTOR DE FUSIÓN & RESOLUCIÓN DE CONFLICTOS (mergeEngine)
 *           -> mergeEngine.detectSessionConflict(): Compara sesiones divergentes.
 *           -> mergeEngine.startDataMerge(): Inicia fusión y gestiona cola interactiva.
 * 
 *  [SEC-07] ANALÍTICA & MÉTRICAS DE FUERZA (analytics)
 *           -> analytics.estimate1RM(): Fórmula de Epley (load * (1 + reps/30)).
 *           -> analytics.getExerciseHistory(), get1RMRecords(), get1RMMonthlySummary().
 * 
 *  [SEC-08] LÓGICA DE NEGOCIO & MUTACIONES (logic)
 *           -> CRUD de semanas y sesiones manuales.
 *           -> logic.updateSet(), logic.applyFlatOverride(), logic.toggleComplete().
 * 
 *  [SEC-09] RENDERIZADO & COMPONENTES UI (ui)
 *           -> ui.render(): Router principal según `state.view` y `state.modal`.
 *           -> ui.renderHome(), renderWeek(), renderSession(), renderExercise().
 *           -> ui.renderHistory(), renderExerciseHistory(), renderModal(), renderSetModal().
 * 
 *  [SEC-10] CONTROLADORES DE EVENTOS & ACCIONES (actions)
 *           -> Navegación: goHome(), openWeek(), openSession(), openExercise().
 *           -> Modales: openImport(), openBackups(), closeModal(), openSetModal().
 *           -> Guardado de sets: saveSetWithRIR(), saveSetWithoutRIR().
 *           -> Resolución interactiva de conflictos: resolveConflictChoice(), resolveAllConflicts().
 * 
 *  [SEC-11] INTEGRACIÓN NATIVA & ARRANQUE (init)
 *           -> Botón atrás nativo de Android (Capacitor App.addListener).
 *           -> Inicialización de tema oscuro/claro y primer render.
 * 
 * ----------------------------------------------------------------------------
 * 💡 GUÍA PARA LLMs: DÓNDE Y CÓMO ACTUAR SEGÚN EL REQUISITO
 * ----------------------------------------------------------------------------
 *  - Añadir Temporizador de Descanso:
 *      1. En [SEC-02], añadir propiedades a `state` (e.g. `timerSeconds`, `timerInterval`).
 *      2. En [SEC-08] o [SEC-10], crear `timer.start()`, `timer.pause()`, `timer.reset()`.
 *      3. En [SEC-09] `ui.renderSession` / `ui.renderExercise`, inyectar widget de temporizador.
 *      4. Al guardar set (`actions.saveSetWithRIR`), auto-iniciar el temporizador si está activo.
 * 
 *  - Gesto de Swipe Back o Botón Atrás Mejorado:
 *      1. En [SEC-11] `initAppListeners`, ajustar `App.addListener('backButton')`.
 *      2. En [SEC-09], añadir listeners táctiles `touchstart` / `touchmove` en `body`.
 * 
 *  - Duplicar Series o Ejercicios Peso Corporal:
 *      1. En [SEC-08] `logic`, añadir `duplicateLastSet(wId, sId, exId)`.
 *      2. En [SEC-04] `validate`, permitir `load = 0` para peso corporal sin alerta.
 *      3. En [SEC-09] `ui.renderExercise`, añadir botón "Duplicar anterior".
 * 
 *  - Modificar / Añadir Nuevas Vistas:
 *      1. En [SEC-02] `state.view`, registrar nuevo nombre de vista.
 *      2. En [SEC-09] `ui.render`, añadir `case 'mi_vista': ui.renderMiVista(); break;`.
 *      3. En [SEC-10] `actions`, crear métodos `openMiVista()`.
 * 
 *  - REGLA DE ORO DE SEGURIDAD:
 *      Al interpolar texto en `innerHTML`, USAR SIEMPRE `${utils.esc(texto)}`.
 *      Al pasar IDs o nombres en `onclick="actions.func('${...}')"`, USAR SIEMPRE
 *      `onclick="actions.func(decodeURIComponent('${utils.encodeParam(id)}'))"`.
 * ============================================================================
 */

// ============================================================================
// [SEC-01] CONSTANTES & CONFIGURACIÓN GLOBAL
// ============================================================================
const STORE_KEY = 'strength_app_v6_data';
const THEME_KEY = 'strength_app_theme';
const BACKUP_PREFIX = 'strength_app_backup_';
const DB_SCHEMA_VERSION = 2;
const MAX_IMPORT_BYTES = 5 * 1024 * 1024; // 5 MB

// Memoria RIR en sesión
let lastRIR = null;

// Bloqueo de pantalla (WakeLock) durante el entrenamiento
const wakeLock = {
    lock: null,
    request: async () => {
        if ('wakeLock' in navigator) {
            try {
                wakeLock.lock = await navigator.wakeLock.request('screen');
            } catch (err) {
                console.warn('Wake Lock no disponible:', err);
            }
        }
    },
    release: async () => {
        if (wakeLock.lock) {
            try {
                await wakeLock.lock.release();
            } catch (err) {
                console.warn('Error al liberar WakeLock:', err);
            }
            wakeLock.lock = null;
        }
    }
};

// ============================================================================
// [SEC-03] UTILIDADES, SANITIZACIÓN & ALMACENAMIENTO (utils)
// ============================================================================
const utils = {
    // Sanitización XSS estricta para HTML e interpolaciones
    esc: (str) => {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
            .replace(/`/g, '&#96;');
    },
    // Codificación segura para parámetros en inline handlers (escapa comillas y barras)
    encodeParam: (str) => {
        return encodeURIComponent(String(str === null || str === undefined ? '' : str))
            .replace(/'/g, '%27')
            .replace(/"/g, '%22')
            .replace(/\\/g, '%5C');
    },
    decodeParam: (str) => {
        try {
            return decodeURIComponent(str || '');
        } catch (e) {
            console.warn('Error al decodificar parámetro:', e);
            return str || '';
        }
    },
    uuid: () => Date.now().toString(36) + Math.random().toString(36).substring(2, 10),
    isoNow: () => new Date().toISOString(),
    formatDate: (isoString) => {
        if (!isoString) return '-';
        try {
            const d = new Date(isoString);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
        } catch (e) {
            console.warn('Error al formatear fecha:', e);
            return '-';
        }
    },
    formatMonth: (monthKey) => {
        try {
            if (!monthKey || typeof monthKey !== 'string') return '-';
            const [year, month] = monthKey.split('-');
            const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
            const idx = parseInt(month, 10) - 1;
            if (idx >= 0 && idx < 12) {
                return `${months[idx]} ${year}`;
            }
            return monthKey;
        } catch (e) {
            console.warn('Error formateando mes:', e);
            return monthKey || '-';
        }
    },
    // Almacenamiento seguro con control de cuota y auto-backup
    save: (data) => {
        try {
            data.schema_version = DB_SCHEMA_VERSION;
            data.modified_at = utils.isoNow();
            localStorage.setItem(STORE_KEY, JSON.stringify(data));
            backup.auto();
            return true;
        } catch (e) {
            console.error('Error al guardar en localStorage:', e);
            // Manejo de cuota excedida: limpiar backups antiguos y reintentar
            try {
                const keys = Object.keys(localStorage).filter(k => k.startsWith(BACKUP_PREFIX)).sort();
                if (keys.length > 2) {
                    keys.slice(0, keys.length - 2).forEach(k => localStorage.removeItem(k));
                    localStorage.setItem(STORE_KEY, JSON.stringify(data));
                    ui.toast('⚠️ Almacenamiento optimizado por espacio');
                    return true;
                }
            } catch (retryErr) {
                console.error('Reintento de guardado fallido:', retryErr);
            }
            ui.toast('⚠️ Espacio de almacenamiento lleno. Exporta tus datos.');
            return false;
        }
    },
    // Carga con migración de esquema y recuperación ante datos corruptos
    load: () => {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) {
            return { schema_version: DB_SCHEMA_VERSION, weeks: {}, created_at: utils.isoNow(), modified_at: utils.isoNow() };
        }
        try {
            const data = JSON.parse(raw);
            return utils.migrateSchema(data);
        } catch (e) {
            console.error('Datos corruptos en localStorage:', e);
            // Recuperar desde el último backup
            const lastBackup = backup.getLatest();
            if (lastBackup) {
                ui.toast('⚠️ Se restauró copia de seguridad tras error');
                return utils.migrateSchema(lastBackup);
            }
            ui.toast('⚠️ Base de datos reinicializada tras error');
            return { schema_version: DB_SCHEMA_VERSION, weeks: {}, created_at: utils.isoNow(), modified_at: utils.isoNow() };
        }
    },
    // Migraciones de esquema
    migrateSchema: (data) => {
        if (!data || typeof data !== 'object') {
            return { schema_version: DB_SCHEMA_VERSION, weeks: {}, created_at: utils.isoNow(), modified_at: utils.isoNow() };
        }
        if (!data.weeks || typeof data.weeks !== 'object') {
            data.weeks = {};
        }
        // Migración v1 -> v2: añadir timestamps e IDs asegurados
        if (!data.schema_version || data.schema_version < 2) {
            data.schema_version = 2;
            data.created_at = data.created_at || utils.isoNow();
            data.modified_at = utils.isoNow();
            Object.values(data.weeks).forEach(w => {
                if (!w.week) w.week = { week_id: utils.uuid(), week_number: 1 };
                w.week.modified_at = w.week.modified_at || w.generated_at || utils.isoNow();
                if (!Array.isArray(w.sessions)) w.sessions = [];
                w.sessions.forEach(s => {
                    s.modified_at = s.modified_at || utils.isoNow();
                    if (!Array.isArray(s.exercises)) s.exercises = [];
                    s.exercises.forEach(e => {
                        e.modified_at = e.modified_at || utils.isoNow();
                        if (!e.execution) e.execution = { sets: [] };
                        if (!Array.isArray(e.execution.sets)) e.execution.sets = [];
                    });
                });
            });
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify(data));
            } catch (err) {
                console.warn('No se pudo guardar la migración inmediatamente:', err);
            }
        }
        return data;
    },
    download: async (data, filename) => {
        const text = JSON.stringify(data, null, 2);
        if (window.Capacitor && Capacitor.isNativePlatform()) {
            const { Filesystem, Share } = Capacitor.Plugins;
            try {
                await Filesystem.writeFile({ path: filename, data: text, directory: 'CACHE', encoding: 'utf8' });
                const uriResult = await Filesystem.getUri({ directory: 'CACHE', path: filename });
                await Share.share({ title: 'Backup Strength Tracker', files: [uriResult.uri] });
                ui.toast("✓ Archivo listo");
            } catch (e) {
                console.warn('Error en Filesystem/Share nativo:', e);
                ui.toast("⚠️ Error nativo. Portapapeles.");
                navigator.clipboard.writeText(text);
            }
        } else {
            const blob = new Blob([text], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    },
    downloadCSV: async (csv, filename) => {
        if (window.Capacitor && Capacitor.isNativePlatform()) {
            const { Filesystem, Share } = Capacitor.Plugins;
            try {
                await Filesystem.writeFile({ path: filename, data: csv, directory: 'CACHE', encoding: 'utf8' });
                const uriResult = await Filesystem.getUri({ directory: 'CACHE', path: filename });
                await Share.share({ title: 'Exportar CSV', files: [uriResult.uri] });
            } catch(e) {
                console.warn('Error al exportar CSV nativo:', e);
                ui.toast("⚠️ Error CSV nativo");
            }
        } else {
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    },
    initTheme: () => {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved) { document.body.className = saved; }
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) { document.body.className = 'light'; }
        else { document.body.className = 'dark'; }
    },
    toggleTheme: () => {
        const current = document.body.className;
        const next = current === 'dark' ? 'light' : 'dark';
        document.body.className = next;
        localStorage.setItem(THEME_KEY, next);
        ui.render();
    }
};

// ============================================================================
// [SEC-04] VALIDACIÓN EXHAUSTIVA & SANITIZACIÓN DE ENTRADA (validate)
// ============================================================================
const validate = {
    number: (value, min, max, name) => {
        const num = parseFloat(value);
        if (isNaN(num)) throw new Error(`${name} debe ser un número válido`);
        if (num < min || num > max) throw new Error(`${name} debe estar entre ${min} y ${max}`);
        return num;
    },
    string: (value, maxLength = 500, name = 'Campo', defaultVal = '') => {
        if (value === null || value === undefined) return defaultVal;
        const str = String(value).trim();
        if (str.length > maxLength) return str.substring(0, maxLength);
        return str;
    },
    json: (str) => {
        if (!str || typeof str !== 'string') throw new Error("Entrada vacía o no es texto");
        if (str.length > MAX_IMPORT_BYTES) throw new Error("El archivo excede el tamaño máximo permitido (5 MB)");
        
        let obj;
        try {
            obj = JSON.parse(str);
        } catch(e) {
            throw new Error(`JSON malformado: ${e.message}`);
        }
        
        if (!obj || typeof obj !== 'object') throw new Error("El JSON debe contener un objeto");
        if (!obj.week_ref && !obj.week) throw new Error("Falta el campo 'week_ref' o 'week'");
        
        const weekObj = obj.week_ref || obj.week;
        if (typeof weekObj !== 'object') throw new Error("'week_ref' debe ser un objeto");
        
        const sessions = obj.sessions;
        if (!sessions || !Array.isArray(sessions)) throw new Error("'sessions' debe ser una lista");
        if (sessions.length > 50) throw new Error("La semana contiene demasiadas sesiones (máximo 50)");

        return validate.sanitizeWeekObject({
            week: weekObj,
            sessions: sessions,
            generated_at: obj.generated_at || utils.isoNow()
        });
    },
    backupJSON: (str) => {
        if (!str || typeof str !== 'string') throw new Error("Entrada de backup vacía");
        if (str.length > MAX_IMPORT_BYTES * 2) throw new Error("El archivo de backup supera el límite permitido");
        
        let obj;
        try {
            obj = JSON.parse(str);
        } catch(e) {
            throw new Error(`Backup JSON malformado: ${e.message}`);
        }
        
        if (!obj || typeof obj !== 'object') throw new Error("Formato de backup inválido");
        
        let extractedData = null;
        if (obj.backup_meta && obj.data) {
            extractedData = obj.data;
        } else if (obj.weeks && typeof obj.weeks === 'object') {
            extractedData = obj;
        } else if (obj.export_meta && Array.isArray(obj.backups) && obj.backups.length > 0) {
            // Último backup del listado de exportación múltiple
            extractedData = obj.backups[0].data;
        }
        
        if (!extractedData || !extractedData.weeks || typeof extractedData.weeks !== 'object') {
            throw new Error("El archivo no contiene semanas válidas");
        }
        
        // Sanitizar cada semana
        const cleanWeeks = {};
        Object.entries(extractedData.weeks).forEach(([key, w]) => {
            if (w && typeof w === 'object') {
                try {
                    const cleanWeek = validate.sanitizeWeekObject(w);
                    cleanWeeks[cleanWeek.week.week_id] = cleanWeek;
                } catch (err) {
                    console.warn(`Semana ignorada por error de validación: ${key}`, err);
                }
            }
        });
        
        return {
            schema_version: DB_SCHEMA_VERSION,
            weeks: cleanWeeks,
            modified_at: utils.isoNow()
        };
    },
    sanitizeWeekObject: (raw) => {
        const rawWeek = raw.week || raw.week_ref || {};
        const weekId = validate.string(rawWeek.week_id, 64, 'week_id', utils.uuid());
        let weekNum = parseInt(rawWeek.week_number, 10);
        if (isNaN(weekNum) || weekNum < 1) weekNum = 1;
        
        const cleanWeekRef = {
            week_id: weekId,
            week_number: weekNum,
            source: validate.string(rawWeek.source, 50, 'source', 'Importado'),
            notes: validate.string(rawWeek.notes, 1000, 'notes', ''),
            modified_at: rawWeek.modified_at || raw.generated_at || utils.isoNow()
        };

        const rawSessions = Array.isArray(raw.sessions) ? raw.sessions : [];
        const cleanSessions = rawSessions.slice(0, 50).map((s, sIdx) => {
            const sId = validate.string(s.session_id, 64, 'session_id', `Día ${sIdx + 1}`);
            const completion = s.session_completion || {};
            const validStatus = ['pending', 'in_progress', 'completed'].includes(completion.status) ? completion.status : 'pending';
            
            const rawExercises = Array.isArray(s.exercises) ? s.exercises : [];
            const cleanExercises = rawExercises.slice(0, 50).map((e, eIdx) => {
                const exId = validate.string(e.exercise_id, 64, 'exercise_id', utils.uuid());
                const exName = validate.string(e.name, 100, 'name', `Ejercicio ${eIdx + 1}`);
                
                // Sets plan
                let baseline = null;
                if (e.baseline && typeof e.baseline === 'object') {
                    baseline = {
                        planned_sets: Math.min(50, Math.max(1, parseInt(e.baseline.planned_sets, 10) || 3)),
                        planned_reps: Math.min(200, Math.max(1, parseInt(e.baseline.planned_reps, 10) || 10)),
                        planned_load: Math.min(2000, Math.max(0, parseFloat(e.baseline.planned_load) || 0))
                    };
                }
                
                let override = null;
                if (e.override && typeof e.override === 'object') {
                    override = {
                        planned_sets: Math.min(50, Math.max(1, parseInt(e.override.planned_sets, 10) || 3)),
                        planned_reps: Math.min(200, Math.max(1, parseInt(e.override.planned_reps, 10) || 10)),
                        planned_load: Math.min(2000, Math.max(0, parseFloat(e.override.planned_load) || 0))
                    };
                }

                // Execution sets
                const rawSets = e.execution && Array.isArray(e.execution.sets) ? e.execution.sets : [];
                const cleanSets = rawSets.slice(0, 50).map((st, stIdx) => {
                    const reps = st.reps !== null && st.reps !== undefined && st.reps !== '' ? Math.min(999, Math.max(0, parseFloat(st.reps))) : null;
                    const load = st.load !== null && st.load !== undefined && st.load !== '' ? Math.min(9999, Math.max(0, parseFloat(st.load))) : null;
                    let rir = st.rir !== null && st.rir !== undefined && st.rir !== '' ? parseInt(st.rir, 10) : null;
                    if (rir !== null && (isNaN(rir) || rir < 0 || rir > 4)) rir = null;

                    return {
                        set_index: stIdx,
                        reps: reps,
                        load: load,
                        rir: rir,
                        notes: validate.string(st.notes, 500, 'set_notes', ''),
                        completed_at: st.completed_at || null,
                        is_extra: Boolean(st.is_extra)
                    };
                });

                const exCompletion = e.completion || {};
                return {
                    exercise_id: exId,
                    name: exName,
                    machine_name: validate.string(e.machine_name || e.equipment_csv_name, 100, 'machine_name', 'General'),
                    equipment_csv_name: validate.string(e.equipment_csv_name, 100, 'equipment_csv_name', ''),
                    recommendations: validate.string(e.recommendations, 500, 'recommendations', ''),
                    baseline: baseline,
                    override: override,
                    execution: { sets: cleanSets },
                    completion: {
                        status: exCompletion.status === 'completed' ? 'completed' : 'pending',
                        completed_at: exCompletion.completed_at || null
                    },
                    notes: validate.string(e.notes, 2000, 'notes', ''),
                    modified_at: e.modified_at || utils.isoNow()
                };
            });

            return {
                session_id: sId,
                title: validate.string(s.title, 100, 'title', 'Entreno'),
                goal_summary: validate.string(s.goal_summary, 500, 'goal_summary', ''),
                estimated_duration_min: parseInt(s.estimated_duration_min, 10) || 45,
                session_completion: {
                    status: validStatus,
                    started_at: completion.started_at || null,
                    completed_at: completion.completed_at || null
                },
                session_notes: validate.string(s.session_notes, 2000, 'session_notes', ''),
                exercises: cleanExercises,
                modified_at: s.modified_at || utils.isoNow()
            };
        });

        return {
            week: cleanWeekRef,
            sessions: cleanSessions,
            generated_at: raw.generated_at || utils.isoNow()
        };
    }
};

// ============================================================================
// [SEC-05] MOTOR DE COPIAS DE SEGURIDAD (backup)
// ============================================================================
const backup = {
    auto: () => {
        try {
            const data = utils.load();
            const today = new Date().toISOString().split('T')[0];
            const backupKey = `${BACKUP_PREFIX}${today}`;
            localStorage.setItem(backupKey, JSON.stringify(data));
            const allKeys = Object.keys(localStorage);
            const backupKeys = allKeys.filter(k => k.startsWith(BACKUP_PREFIX)).sort().reverse();
            backupKeys.slice(5).forEach(k => localStorage.removeItem(k));
        } catch(e) {
            console.error('Error backup:', e);
        }
    },
    list: () => Object.keys(localStorage).filter(k => k.startsWith(BACKUP_PREFIX)).map(k => k.replace(BACKUP_PREFIX, '')).sort().reverse(),
    get: (date) => {
        const data = localStorage.getItem(`${BACKUP_PREFIX}${date}`);
        return data ? JSON.parse(data) : null;
    },
    getLatest: () => {
        const dates = backup.list();
        if (dates.length === 0) return null;
        return backup.get(dates[0]);
    },
    download: (date) => {
        const data = backup.get(date);
        if (!data) { ui.toast('⚠️ Backup no encontrado'); return; }
        const backupFile = { backup_meta: { date: date, created_at: new Date().toISOString(), version: "6.7" }, data: data };
        utils.download(backupFile, `strength_backup_${date}.json`);
    },
    downloadAll: () => {
        const dates = backup.list();
        if (dates.length === 0) { ui.toast('⚠️ No hay backups'); return; }
        const allBackups = dates.map(date => ({ date: date, data: backup.get(date) }));
        const exportFile = { export_meta: { created_at: new Date().toISOString(), version: "6.7", total_backups: allBackups.length }, backups: allBackups };
        utils.download(exportFile, `strength_backups_all_${new Date().toISOString().split('T')[0]}.json`);
    },
    restore: (date) => {
        const data = backup.get(date);
        if (!data) { ui.toast('⚠️ Backup no encontrado'); return; }
        if (!confirm(`¿Restaurar backup del ${utils.formatDate(date)}?`)) return;
        utils.save(data);
        db = utils.load();
        ui.toast('✓ Backup restaurado');
        state.modal = null;
        actions.goHome();
    },
    mergeRestore: (importedData) => {
        mergeEngine.startDataMerge(importedData);
    },
    restoreFromJSON: (jsonString, mode = 'merge') => {
        try {
            const data = validate.backupJSON(jsonString);
            if (mode === 'replace') {
                if (!confirm(`⚠️ ALERTA DE BORRADO\n\nVas a reemplazar TODA la base de datos con este backup. Se perderán los datos actuales no guardados.\n\n¿Continuar?`)) return;
                utils.save(data);
                db = utils.load();
                ui.toast('✓ Base de datos reemplazada');
                state.modal = null;
                actions.goHome();
            } else {
                backup.mergeRestore(data);
            }
        } catch(e) {
            console.error('Error restaurando backup:', e);
            ui.toast(`⚠️ ${e.message}`);
        }
    }
};

// ============================================================================
// [SEC-06] MOTOR DE FUSIÓN & RESOLUCIÓN DE CONFLICTOS (mergeEngine)
// ============================================================================
const mergeEngine = {
    // Detecta si dos sesiones con mismo ID tienen cambios divergentes reales
    detectSessionConflict: (localS, incomingS) => {
        if (!localS || !incomingS) return false;
        // Si una de ellas tiene series completadas y la otra está vacía, no es conflicto: se toma la completada
        const localSetsDone = (localS.exercises || []).reduce((acc, e) => acc + (e.execution?.sets?.filter(s => s.reps > 0).length || 0), 0);
        const incomingSetsDone = (incomingS.exercises || []).reduce((acc, e) => acc + (e.execution?.sets?.filter(s => s.reps > 0).length || 0), 0);
        
        if (localSetsDone === 0 && incomingSetsDone > 0) return false;
        if (incomingSetsDone === 0 && localSetsDone > 0) return false;
        if (localSetsDone === 0 && incomingSetsDone === 0) return false;

        // Si ambas tienen series registradas, comparar contenido
        const localJSON = JSON.stringify(localS.exercises || []);
        const incomingJSON = JSON.stringify(incomingS.exercises || []);
        return localJSON !== incomingJSON;
    },

    // Inicia proceso de fusión de base de datos completa o semana
    startDataMerge: (importedData) => {
        const currentData = utils.load();
        const conflicts = [];
        const mergedWeeks = { ...currentData.weeks };

        Object.values(importedData.weeks || {}).forEach(incomingWeek => {
            const weekId = incomingWeek.week.week_id;
            const existingWeek = mergedWeeks[weekId];

            if (!existingWeek) {
                mergedWeeks[weekId] = incomingWeek;
            } else {
                // Fusión de sesiones dentro de la semana
                const mergedSessions = [...existingWeek.sessions];
                const existingSessionMap = new Map();
                mergedSessions.forEach((s, idx) => existingSessionMap.set(s.session_id, { session: s, index: idx }));

                incomingWeek.sessions.forEach(incomingSession => {
                    const existing = existingSessionMap.get(incomingSession.session_id);
                    if (!existing) {
                        mergedSessions.push(incomingSession);
                    } else {
                        // Comprobar conflicto
                        const isConflict = mergeEngine.detectSessionConflict(existing.session, incomingSession);
                        if (isConflict) {
                            conflicts.push({
                                type: 'session',
                                weekId: weekId,
                                weekNumber: existingWeek.week.week_number,
                                sessionId: incomingSession.session_id,
                                local: existing.session,
                                incoming: incomingSession
                            });
                        } else {
                            // Si el entrante tiene más datos o es más reciente, actualizar
                            const incomingSets = (incomingSession.exercises || []).reduce((acc, e) => acc + (e.execution?.sets?.filter(s => s.reps > 0).length || 0), 0);
                            const localSets = (existing.session.exercises || []).reduce((acc, e) => acc + (e.execution?.sets?.filter(s => s.reps > 0).length || 0), 0);
                            if (incomingSets >= localSets) {
                                mergedSessions[existing.index] = incomingSession;
                            }
                        }
                    }
                });

                mergedWeeks[weekId] = {
                    ...existingWeek,
                    sessions: mergedSessions,
                    modified_at: utils.isoNow()
                };
            }
        });

        if (conflicts.length > 0) {
            // Activar cola interactiva de resolución de conflictos
            state.pendingMergeData = mergedWeeks;
            state.conflictQueue = conflicts;
            state.currentConflictIndex = 0;
            state.modal = 'conflict';
            ui.render();
        } else {
            // Guardar directamente
            currentData.weeks = mergedWeeks;
            utils.save(currentData);
            db = currentData;
            ui.toast('✓ Datos fusionados sin conflictos');
            state.modal = null;
            actions.goHome();
        }
    }
};

// ============================================================================
// [SEC-07] ANALÍTICA & MÉTRICAS DE FUERZA (analytics)
// ============================================================================
const analytics = {
    estimate1RM: (weight, reps) => {
        if (!weight || !reps) return null;
        if (reps === 1) return weight;
        return Math.round(weight * (1 + reps / 30) * 10) / 10;
    },
    getExerciseHistory: (exerciseName) => {
        const sessions = [];
        Object.values(db.weeks).forEach(w => {
            w.sessions.forEach(s => {
                if (s.session_completion.status !== 'completed') return;
                s.exercises.filter(e => e.name === exerciseName).forEach(e => {
                    e.execution.sets.forEach((set, idx) => {
                        if (set.load && set.reps) {
                            sessions.push({
                                date: s.session_completion.completed_at || s.session_completion.started_at,
                                weekNum: w.week.week_number,
                                sessionId: s.session_id,
                                setIndex: idx + 1,
                                reps: set.reps,
                                load: set.load,
                                estimated1RM: analytics.estimate1RM(set.load, set.reps),
                                rir: set.rir !== undefined ? set.rir : null,
                                notes: set.notes || ""
                            });
                        }
                    });
                });
            });
        });
        return sessions.sort((a, b) => new Date(b.date) - new Date(a.date));
    },
    getBest1RM: (exerciseName) => {
        const history = analytics.getExerciseHistory(exerciseName);
        if (history.length === 0) return null;
        return history.reduce((best, curr) => (curr.estimated1RM > best) ? curr.estimated1RM : best, 0);
    },
    get1RMRecords: (exerciseName) => {
        const history = analytics.getExerciseHistory(exerciseName);
        if (history.length === 0) return [];
        const records = [];
        let currentBest = 0;
        history.reverse().forEach(session => {
            if (session.estimated1RM > currentBest) {
                records.push({
                    date: session.date,
                    value: session.estimated1RM,
                    improvement: currentBest > 0 ? session.estimated1RM - currentBest : 0,
                    reps: session.reps,
                    load: session.load
                });
                currentBest = session.estimated1RM;
            }
        });
        return records.reverse();
    },
    get1RMMonthlySummary: (exerciseName) => {
        const history = analytics.getExerciseHistory(exerciseName);
        if (history.length === 0) return [];
        const monthlyBest = {};
        history.forEach(session => {
            const date = new Date(session.date);
            if (isNaN(date.getTime())) return;
            const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
            if (!monthlyBest[monthKey] || session.estimated1RM > monthlyBest[monthKey].value) {
                monthlyBest[monthKey] = { month: monthKey, value: session.estimated1RM, date: session.date, reps: session.reps, load: session.load };
            }
        });
        return Object.values(monthlyBest).sort((a, b) => b.month.localeCompare(a.month));
    },
    getRecentSets: (exerciseName, days = 30) => {
        const history = analytics.getExerciseHistory(exerciseName);
        const cutoffDate = new Date();
        cutoffDate.setDate(cutoffDate.getDate() - days);
        return history.filter(s => new Date(s.date) >= cutoffDate);
    },
    getGlobalBest1RM: () => {
        let best = 0;
        let bestExercise = null;
        analytics.getAllExercises().forEach(ex => {
            const exBest = analytics.getBest1RM(ex);
            if (exBest !== null && exBest > best) {
                best = exBest;
                bestExercise = ex;
            }
        });
        return best > 0 ? { value: best, exercise: bestExercise } : null;
    },
    getLastSessionDate: () => {
        let latest = null;
        Object.values(db.weeks).forEach(w => {
            w.sessions.forEach(s => {
                if (s.session_completion.status !== 'completed') return;
                const dateStr = s.session_completion.completed_at || s.session_completion.started_at;
                if (!dateStr) return;
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return;
                if (!latest || d > latest.date) latest = { date: d, weekNumber: w.week.week_number, sessionId: s.session_id };
            });
        });
        return latest;
    },
    getStreakDays: () => {
        const dates = new Set();
        Object.values(db.weeks).forEach(w => {
            w.sessions.forEach(s => {
                if (s.session_completion.status !== 'completed') return;
                const dateStr = s.session_completion.completed_at || s.session_completion.started_at;
                if (!dateStr) return;
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return;
                dates.add(d.toISOString().split('T')[0]);
            });
        });
        if (dates.size === 0) return 0;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const sortedDates = Array.from(dates).sort().reverse();
        let streak = 0;
        let cursor = new Date(today);
        const mostRecent = new Date(sortedDates[0]);
        if (mostRecent.getTime() === today.getTime() || mostRecent.getTime() === yesterday.getTime()) {
            cursor = mostRecent;
            streak = 1;
            for (let i = 1; i < sortedDates.length; i++) {
                const prev = new Date(sortedDates[i]);
                const diff = (cursor - prev) / (1000 * 60 * 60 * 24);
                if (Math.round(diff) === 1) {
                    streak++;
                    cursor = prev;
                } else break;
            }
        }
        return streak;
    },
    getAllExercises: () => {
        const exercises = new Set();
        Object.values(db.weeks).forEach(w => {
            w.sessions.forEach(s => {
                s.exercises.forEach(e => exercises.add(e.name));
            });
        });
        return Array.from(exercises).sort();
    },
    exportToCSV: (exerciseName) => {
        const history = analytics.getExerciseHistory(exerciseName);
        if (history.length === 0) return null;
        let csv = 'Fecha,Ejercicio,Set,Reps,Carga,1RM_Estimado,RIR,Notas\n';
        history.forEach(h => {
            const date = utils.formatDate(h.date);
            const rir = h.rir !== null ? h.rir : '-';
            const notes = (h.notes || '').replace(/"/g, '""');
            csv += `"${date}","${exerciseName.replace(/"/g, '""')}",${h.setIndex},${h.reps},${h.load},${h.estimated1RM || '-'},${rir},"${notes}"\n`;
        });
        return csv;
    },
    exportToJSON: (exerciseName) => {
        const history = analytics.getExerciseHistory(exerciseName);
        return {
            exercise: exerciseName,
            exported_at: new Date().toISOString(),
            best_1rm: analytics.getBest1RM(exerciseName),
            total_sets: history.length,
            history: history
        };
    },
    exportAll1RMs: () => {
        const exercises = analytics.getAllExercises();
        const all1RMs = [];
        exercises.forEach(exName => {
            const best1RM = analytics.getBest1RM(exName);
            const records = analytics.get1RMRecords(exName);
            const monthlySummary = analytics.get1RMMonthlySummary(exName);
            all1RMs.push({
                exercise: exName,
                best_1rm: best1RM,
                total_records: records.length,
                records: records,
                monthly_summary: monthlySummary
            });
        });
        return {
            exported_at: new Date().toISOString(),
            total_exercises: exercises.length,
            exercises: all1RMs
        };
    },
    exportAll1RMsCSV: () => {
        const exercises = analytics.getAllExercises();
        let csv = 'Ejercicio,Mejor 1RM (kg),Fecha Mejor,Histórico Récords\n';
        exercises.forEach(exName => {
            const best1RM = analytics.getBest1RM(exName);
            const records = analytics.get1RMRecords(exName);
            const bestRecord = records.length > 0 ? records[0] : null;
            const recordHistory = records.map(r => `${r.value}kg (${utils.formatDate(r.date)})`).join(' → ');
            csv += `"${exName.replace(/"/g, '""')}",${best1RM || '-'},${bestRecord ? utils.formatDate(bestRecord.date) : '-'},"${recordHistory.replace(/"/g, '""')}"\n`;
        });
        return csv;
    }
};

// ============================================================================
// [SEC-08] LÓGICA DE NEGOCIO & MUTACIONES (logic)
// ============================================================================
const logic = {
    createManualWeek: () => {
        const weekNum = Object.keys(db.weeks).length + 1;
        const weekId = utils.uuid();
        const newWeek = {
            week: { week_id: weekId, week_number: weekNum, source: "Manual", modified_at: utils.isoNow() },
            sessions: [],
            generated_at: utils.isoNow()
        };
        db.weeks[weekId] = newWeek;
        utils.save(db);
        ui.toast("✓ Semana creada");
        actions.openWeek(weekId);
    },
    addSessionToWeek: (weekId) => {
        const week = db.weeks[weekId];
        if (!week) return;
        const nextSessionNum = week.sessions.length + 1;
        const sessionId = `Día ${nextSessionNum}`;
        const newSession = {
            session_id: sessionId,
            title: "Nueva Sesión Ad-Hoc",
            goal_summary: "Sesión añadida manualmente",
            estimated_duration_min: 45,
            session_completion: { status: 'pending', started_at: null, completed_at: null },
            session_notes: "",
            exercises: [],
            modified_at: utils.isoNow()
        };
        week.sessions.push(newSession);
        week.modified_at = utils.isoNow();
        utils.save(db);
        ui.toast("✓ Sesión añadida");
        ui.render();
    },
    createWeekFromImport: (cleanWeekObj) => {
        const weekId = cleanWeekObj.week.week_id;
        mergeEngine.startDataMerge({
            weeks: { [weekId]: cleanWeekObj }
        });
        return weekId;
    },
    getWeek: (id) => db.weeks[id],
    getSession: (wId, sId) => db.weeks[wId]?.sessions.find(s => s.session_id === sId),
    getExercise: (wId, sId, exId) => logic.getSession(wId, sId)?.exercises.find(e => e.exercise_id === exId),
    getResolvedPlan: (ex) => {
        if (!ex) return [];
        if (ex.override) {
            const sets = [];
            for (let i = 0; i < ex.override.planned_sets; i++) {
                sets.push({ set_index: i, reps: ex.override.planned_reps, load: ex.override.planned_load, unit: 'kg', source: 'override' });
            }
            return sets;
        }
        if (ex.baseline && ex.baseline.set_plan && Array.isArray(ex.baseline.set_plan)) {
            return ex.baseline.set_plan.map(s => ({ ...s, source: 'baseline' }));
        }
        if (ex.baseline && ex.baseline.planned_sets) {
            const sets = [];
            for(let i=0; i<ex.baseline.planned_sets; i++) {
                sets.push({ set_index: i, reps: ex.baseline.planned_reps, load: ex.baseline.planned_load, unit: 'kg', source: 'baseline_flat'});
            }
            return sets;
        }
        return [];
    },
    startSession: (wId, sId) => {
        const s = logic.getSession(wId, sId);
        if (s && s.session_completion.status === 'pending') {
            s.session_completion.status = 'in_progress';
            s.session_completion.started_at = utils.isoNow();
            s.modified_at = utils.isoNow();
            utils.save(db);
            wakeLock.request();
        }
    },
    finishSession: (wId, sId) => {
        const s = logic.getSession(wId, sId);
        if (!s) return null;
        s.session_completion.status = 'completed';
        s.session_completion.completed_at = utils.isoNow();
        s.modified_at = utils.isoNow();
        utils.save(db);
        wakeLock.release();
        return logic.generateReport(wId, sId);
    },
    updateSet: (wId, sId, exId, setIndex, data) => {
        const ex = logic.getExercise(wId, sId, exId);
        if (!ex) return;
        while(ex.execution.sets.length <= setIndex) {
            ex.execution.sets.push({ reps: null, load: null, rir: null, notes: "" });
        }
        const set = ex.execution.sets[setIndex];
        if (data.reps !== undefined) set.reps = data.reps !== null && data.reps !== '' ? parseFloat(data.reps) : null;
        if (data.load !== undefined) set.load = data.load !== null && data.load !== '' ? parseFloat(data.load) : null;
        if (data.rir !== undefined) set.rir = data.rir;
        if (data.notes !== undefined) set.notes = validate.string(data.notes, 500);
        set.completed_at = utils.isoNow();
        ex.modified_at = utils.isoNow();
        utils.save(db);
    },
    updateExerciseNote: (wId, sId, exId, text) => {
        const ex = logic.getExercise(wId, sId, exId);
        if (!ex) return;
        ex.notes = validate.string(text, 2000);
        ex.modified_at = utils.isoNow();
        utils.save(db);
    },
    updateSessionNote: (wId, sId, text) => {
        const s = logic.getSession(wId, sId);
        if (!s) return;
        s.session_notes = validate.string(text, 2000);
        s.modified_at = utils.isoNow();
        utils.save(db);
    },
    addSet: (wId, sId, exId) => {
        const ex = logic.getExercise(wId, sId, exId);
        if (!ex) return;
        ex.execution.sets.push({ reps: 0, load: 0, rir: null, notes: "", is_extra: true, completed_at: utils.isoNow() });
        ex.modified_at = utils.isoNow();
        utils.save(db);
        ui.render();
    },
    applyFlatOverride: (wId, sId, exId, sets, reps, load) => {
        try {
            const ex = logic.getExercise(wId, sId, exId);
            if (!ex) return;
            const validSets = validate.number(sets, 1, 50, 'Sets');
            const validReps = validate.number(reps, 1, 200, 'Reps');
            const validLoad = validate.number(load, 0, 2000, 'Carga');
            ex.override = { planned_sets: validSets, planned_reps: validReps, planned_load: validLoad };
            ex.modified_at = utils.isoNow();
            utils.save(db);
            ui.toast('✓ Plan actualizado');
            ui.render();
        } catch(e) {
            console.warn('Error al aplicar override:', e);
            ui.toast(`⚠️ ${e.message}`);
        }
    },
    toggleComplete: (wId, sId, exId) => {
        const ex = logic.getExercise(wId, sId, exId);
        if (!ex) return;
        ex.completion.status = ex.completion.status === 'completed' ? 'pending' : 'completed';
        ex.completion.completed_at = ex.completion.status === 'completed' ? utils.isoNow() : null;
        ex.modified_at = utils.isoNow();
        utils.save(db);
        ui.render();
    },
    addNewExerciseToSession: (wId, sId) => {
        const name = prompt("Nombre del nuevo ejercicio:");
        if(!name || name.trim() === '') return;
        const s = logic.getSession(wId, sId);
        if (!s) return;
        const newEx = {
            exercise_id: utils.uuid(),
            name: validate.string(name, 100),
            machine_name: "Ad-hoc",
            equipment_csv_name: "",
            recommendations: "",
            baseline: { planned_sets: 3, planned_reps: 10, planned_load: 10 },
            override: null,
            execution: { sets: [] },
            completion: { status: 'pending', completed_at: null },
            notes: "",
            modified_at: utils.isoNow()
        };
        s.exercises.push(newEx);
        s.modified_at = utils.isoNow();
        utils.save(db);
        ui.render();
        ui.toast("✓ Ejercicio añadido");
    },
    generateReport: (wId, sId) => {
        const w = logic.getWeek(wId);
        const s = logic.getSession(wId, sId);
        return {
            schema_version: "2.0",
            week_ref: w ? w.week : null,
            session_result: s,
            export_meta: { date: utils.isoNow() }
        };
    },
    deleteWeek: (id) => {
        const w = logic.getWeek(id);
        if (!w) return;
        const hasCompleted = w.sessions.some(s => s.session_completion.status === 'completed');
        if (hasCompleted) {
            if (!confirm(`⚠️ La semana ${w.week.week_number} tiene sesiones completadas.\n\n¿Borrar?`)) return;
        }
        if(confirm(`¿Borrar semana ${w.week.week_number}?`)) {
            delete db.weeks[id];
            utils.save(db);
            actions.goHome();
            ui.toast('✓ Semana eliminada');
        }
    },
    getNextExercise: (wId, sId, currentExId) => {
        const s = logic.getSession(wId, sId);
        if (!s) return null;
        const currentIdx = s.exercises.findIndex(e => e.exercise_id === currentExId);
        if (currentIdx === -1 || currentIdx === s.exercises.length - 1) return null;
        return s.exercises[currentIdx + 1];
    }
};
