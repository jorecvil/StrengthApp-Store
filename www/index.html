<body class="dark"><div id="app"></div><div id="toast">Notificación</div>
<script>
/**
 * STRENGTH TRACKER V6.6
 * - CRUD Manual: Crear semanas vacías y sesiones Ad-Hoc.
 * - Backup Inteligente: Merge/Fusión de datos entre dispositivos.
 * - Optimización: Limpieza de localStorage.
 * - Nativo: Android ready.
 */
const STORE_KEY = 'strength_app_v6_data';
const THEME_KEY = 'strength_app_theme';
const BACKUP_PREFIX = 'strength_app_backup_';

// Memoria RIR
let lastRIR = null;

const wakeLock = {
    lock: null,
    request: async () => {
        if ('wakeLock' in navigator) {
            try {
                wakeLock.lock = await navigator.wakeLock.request('screen');
            } catch (err) { console.warn('Wake Lock no disponible'); }
        }
    },
    release: async () => {
        if (wakeLock.lock) {
            await wakeLock.lock.release();
            wakeLock.lock = null;
        }
    }
};

const validate = {
    json: (str) => {
        try {
            const obj = JSON.parse(str);
            if (!obj.week_ref) throw new Error("Falta 'week_ref'");
            if (!obj.sessions || !Array.isArray(obj.sessions)) throw new Error("'sessions' debe ser un array");
            return obj;
        } catch(e) { throw new Error(`JSON inválido: ${e.message}`); }
    },
    backupJSON: (str) => {
        try {
            const obj = JSON.parse(str);
            if (obj.backup_meta && obj.data) return obj.data;
            if (obj.weeks && typeof obj.weeks === 'object') return obj;
            throw new Error("No es un backup válido");
        } catch(e) { throw new Error(`Backup inválido: ${e.message}`); }
    },
    number: (value, min, max, name) => {
        const num = parseFloat(value);
        if (isNaN(num)) throw new Error(`${name} debe ser un número`);
        if (num < min || num > max) throw new Error(`${name} debe estar entre ${min} y ${max}`);
        return num;
    }
};

// UTILIDADES HÍBRIDAS (Nativo/Web)
const utils = {
    uuid: () => Date.now().toString(36) + Math.random().toString(36).substr(2),
    isoNow: () => new Date().toISOString(),
    formatDate: (isoString) => {
        if (!isoString) return '-';
        const d = new Date(isoString);
        return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
    },
    formatMonth: (monthKey) => {
        const [year, month] = monthKey.split('-');
        const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
        return `${months[parseInt(month) - 1]} ${year}`;
    },
    save: (data) => {
        localStorage.setItem(STORE_KEY, JSON.stringify(data));
        backup.auto();
    },
    load: () => {
        const raw = localStorage.getItem(STORE_KEY);
        return raw ? JSON.parse(raw) : { weeks: {} };
    },
    download: async (data, filename) => {
        const text = JSON.stringify(data, null, 2);
        if (window.Capacitor && Capacitor.isNativePlatform()) {
            const { Filesystem, Share } = Capacitor.Plugins;
            try {
                await Filesystem.writeFile({ path: filename, data: text, directory: 'CACHE', encoding: 'utf8' });
                const uriResult = await Filesystem.getUri({ directory: 'CACHE', path: filename });
                await Share.share({ title: 'Backup Strength Tracker', files: [uriResult.uri] });
                ui.toast("✓ Archivo listo");
            } catch (e) {
                ui.toast("⚠️ Error nativo. Portapapeles.");
                navigator.clipboard.writeText(text);
            }
        } else {
            const blob = new Blob([text], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    },
    downloadCSV: async (csv, filename) => {
        if (window.Capacitor && Capacitor.isNativePlatform()) {
            const { Filesystem, Share } = Capacitor.Plugins;
            try {
                await Filesystem.writeFile({ path: filename, data: csv, directory: 'CACHE', encoding: 'utf8' });
                const uriResult = await Filesystem.getUri({ directory: 'CACHE', path: filename });
                await Share.share({ title: 'Exportar CSV', files: [uriResult.uri] });
            } catch(e) { ui.toast("⚠️ Error CSV nativo"); }
        } else {
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    },
    initTheme: () => {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved) { document.body.className = saved; }
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) { document.body.className = 'light'; }
        else { document.body.className = 'dark'; }
    },
    toggleTheme: () => {
        const current = document.body.className;
        const next = current === 'dark' ? 'light' : 'dark';
        document.body.className = next;
        localStorage.setItem(THEME_KEY, next);
        ui.render();
    }
};

const backup = {
    // Optimización: Solo guarda los últimos 5 backups
    auto: () => {
        try {
            const data = utils.load();
            const today = new Date().toISOString().split('T')[0];
            const backupKey = `${BACKUP_PREFIX}${today}`;
            localStorage.setItem(backupKey, JSON.stringify(data));
            const allKeys = Object.keys(localStorage);
            const backupKeys = allKeys.filter(k => k.startsWith(BACKUP_PREFIX)).sort().reverse();
            backupKeys.slice(5).forEach(k => localStorage.removeItem(k));
        } catch(e) { console.error('Error backup:', e); }
    },
    list: () => Object.keys(localStorage).filter(k => k.startsWith(BACKUP_PREFIX)).map(k => k.replace(BACKUP_PREFIX, '')).sort().reverse(),
    get: (date) => {
        const data = localStorage.getItem(`${BACKUP_PREFIX}${date}`);
        return data ? JSON.parse(data) : null;
    },
    download: (date) => {
        const data = backup.get(date);
        if (!data) { ui.toast('⚠️ Backup no encontrado'); return; }
        const backupFile = { backup_meta: { date: date, created_at: new Date().toISOString(), version: "6.6" }, data: data };
        utils.download(backupFile, `strength_backup_${date}.json`);
    },
    downloadAll: () => {
        const dates = backup.list();
        if (dates.length === 0) { ui.toast('⚠️ No hay backups'); return; }
        const allBackups = dates.map(date => ({ date: date, data: backup.get(date) }));
        const exportFile = { export_meta: { created_at: new Date().toISOString(), version: "6.6", total_backups: allBackups.length }, backups: allBackups };
        utils.download(exportFile, `strength_backups_all_${new Date().toISOString().split('T')[0]}.json`);
    },
    // FUSIÓN DE BACKUPS (MERGE RESTORE)
    mergeRestore: (importedData) => {
        const currentData = utils.load();
        
        // Iterar sobre las semanas del backup
        Object.values(importedData.weeks || {}).forEach(importedWeek => {
            const weekId = importedWeek.week.week_id;
            
            if (currentData.weeks[weekId]) {
                // Si la semana existe, FUSIONAR sesiones
                currentData.weeks[weekId] = logic.mergeWeeks(currentData.weeks[weekId], importedWeek);
            } else {
                // Si es nueva, AÑADIRLA
                currentData.weeks[weekId] = importedWeek;
            }
        });

        // Guardar resultado
        utils.save(currentData);
        db = currentData;
        ui.toast('✓ Backup fusionado (Datos combinados)');
        state.modal = null;
        actions.goHome();
    },
    restoreFromJSON: (jsonString, mode = 'merge') => {
        try {
            const data = validate.backupJSON(jsonString);
            
            if (mode === 'replace') {
                if (!confirm(`⚠️ ALERTA DE BORRADO\n\nVas a reemplazar TODA la base de datos con este backup. Se perderán los datos actuales no guardados.\n\n¿Continuar?`)) return;
                localStorage.setItem(STORE_KEY, JSON.stringify(data));
                db = utils.load();
                ui.toast('✓ Base de datos reemplazada');
                state.modal = null;
                actions.goHome();
            } else {
                // Modo Merge (Por defecto)
                backup.mergeRestore(data);
            }
            backup.auto();
        } catch(e) { ui.toast(`⚠️ ${e.message}`); }
    }
};

const analytics = {
    estimate1RM: (weight, reps) => {
        if (!weight || !reps) return null;
        if (reps === 1) return weight;
        return Math.round(weight * (1 + reps / 30) * 10) / 10;
    },
    getExerciseHistory: (exerciseName) => {
        const sessions = [];
        Object.values(db.weeks).forEach(w => {
            w.sessions.forEach(s => {
                if (s.session_completion.status !== 'completed') return;
                s.exercises.filter(e => e.name === exerciseName).forEach(e => {
                    e.execution.sets.forEach((set, idx) => {
                        if (set.load && set.reps) {
                            sessions.push({
                                date: s.session_completion.completed_at || s.session_completion.started_at,
                                weekNum: w.week.week_number,
                                sessionId: s.session_id,
                                setIndex: idx + 1,
                                reps: set.reps,
                                load: set.load,
                                estimated1RM: analytics.estimate1RM(set.load, set.reps),
                                rir: set.rir !== undefined ? set.rir : null,
                                notes: set.notes || ""
                            });
                        }
                    });
                });
            });
        });
        return sessions.sort((a, b) => new Date(b.date) - new Date(a.date));
    },
    getBest1RM: (exerciseName) => {
        const history = analytics.getExerciseHistory(exerciseName);
        if (history.length === 0) return null;
        return history.reduce((best, curr) => (curr.estimated1RM > best) ? curr.estimated1RM : best, 0);
    },
    get1RMRecords: (exerciseName) => {
        const history = analytics.getExerciseHistory(exerciseName);
        if (history.length === 0) return [];
        const records = [];
        let currentBest = 0;
        history.reverse().forEach(session => {
            if (session.estimated1RM > currentBest) {
                records.push({
                    date: session.date,
                    value: session.estimated1RM,
                    improvement: currentBest > 0 ? session.estimated1RM - currentBest : 0,
                    reps: session.reps,
                    load: session.load
                });
                currentBest = session.estimated1RM;
            }
        });
        return records.reverse();
    },
    get1RMMonthlySummary: (exerciseName) => {
        const history = analytics.getExerciseHistory(exerciseName);
        if (history.length === 0) return [];
        const monthlyBest = {};
        history.forEach(session => {
            const date = new Date(session.date);
            const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
            if (!monthlyBest[monthKey] || session.estimated1RM > monthlyBest[monthKey].value) {
                monthlyBest[monthKey] = { month: monthKey, value: session.estimated1RM, date: session.date, reps: session.reps, load: session.load };
            }
        });
        return Object.values(monthlyBest).sort((a, b) => b.month.localeCompare(a.month));
    },
    getRecentSets: (exerciseName, days = 30) => {
        const history = analytics.getExerciseHistory(exerciseName);
        const cutoffDate = new Date();
        cutoffDate.setDate(cutoffDate.getDate() - days);
        return history.filter(s => new Date(s.date) >= cutoffDate);
    },
    getAllExercises: () => {
        const exercises = new Set();
        Object.values(db.weeks).forEach(w => {
            w.sessions.forEach(s => {
                s.exercises.forEach(e => exercises.add(e.name));
            });
        });
        return Array.from(exercises).sort();
    },
    exportToCSV: (exerciseName) => {
        const history = analytics.getExerciseHistory(exerciseName);
        if (history.length === 0) return null;
        let csv = 'Fecha,Ejercicio,Set,Reps,Carga,1RM_Estimado,RIR,Notas\n';
        history.forEach(h => {
            const date = utils.formatDate(h.date);
            const rir = h.rir !== null ? h.rir : '-';
            const notes = (h.notes || '').replace(/,/g, ';');
            csv += `${date},${exerciseName},${h.setIndex},${h.reps},${h.load},${h.estimated1RM || '-'},${rir},"${notes}"\n`;
        });
        return csv;
    },
    exportToJSON: (exerciseName) => {
        const history = analytics.getExerciseHistory(exerciseName);
        return {
            exercise: exerciseName,
            exported_at: new Date().toISOString(),
            best_1rm: analytics.getBest1RM(exerciseName),
            total_sets: history.length,
            history: history
        };
    },
    exportAll1RMs: () => {
        const exercises = analytics.getAllExercises();
        const all1RMs = [];
        exercises.forEach(exName => {
            const best1RM = analytics.getBest1RM(exName);
            const records = analytics.get1RMRecords(exName);
            const monthlySummary = analytics.get1RMMonthlySummary(exName);
            all1RMs.push({
                exercise: exName,
                best_1rm: best1RM,
                total_records: records.length,
                records: records,
                monthly_summary: monthlySummary
            });
        });
        return {
            exported_at: new Date().toISOString(),
            total_exercises: exercises.length,
            exercises: all1RMs
        };
    },
    exportAll1RMsCSV: () => {
        const exercises = analytics.getAllExercises();
        let csv = 'Ejercicio,Mejor 1RM (kg),Fecha Mejor,Histórico Récords\n';
        exercises.forEach(exName => {
            const best1RM = analytics.getBest1RM(exName);
            const records = analytics.get1RMRecords(exName);
            const bestRecord = records.length > 0 ? records[0] : null;
            const recordHistory = records.map(r => `${r.value}kg (${utils.formatDate(r.date)})`).join(' → ');
            csv += `"${exName}",${best1RM || '-'},${bestRecord ? utils.formatDate(bestRecord.date) : '-'},"${recordHistory}"\n`;
        });
        return csv;
    }
};

let db = utils.load();
let state = {
    view: 'home',
    activeWeekId: null,
    activeSessionId: null,
    activeExerciseId: null,
    historyExercise: null,
    modal: null,
    setModal: null
};

const logic = {
    mergeWeeks: (existingWeek, newWeek) => {
        const mergedSessions = [...existingWeek.sessions]; 
        const existingIds = new Set(mergedSessions.map(s => s.session_id));
        newWeek.sessions.forEach(newSession => {
            if (!existingIds.has(newSession.session_id)) {
                const cleanSession = {
                    ...newSession,
                    session_completion: newSession.session_completion || { status: 'pending', started_at: null, completed_at: null },
                    session_notes: newSession.session_notes || "",
                    exercises: newSession.exercises.map(e => ({
                        ...e,
                        override: null,
                        execution: { sets: [] },
                        completion: { status: 'pending', completed_at: null },
                        notes: ""
                    }))
                };
                mergedSessions.push(cleanSession);
            }
        });
        return {
            ...existingWeek, 
            sessions: mergedSessions, 
            generated_at: utils.isoNow()
        };
    },
    // NUEVO: CREAR SEMANA MANUAL
    createManualWeek: () => {
        const weekNum = Object.keys(db.weeks).length + 1;
        const weekId = utils.uuid();
        const newWeek = {
            week: { week_id: weekId, week_number: weekNum, source: "Manual" },
            sessions: [],
            generated_at: utils.isoNow()
        };
        db.weeks[weekId] = newWeek;
        utils.save(db);
        ui.toast("✓ Semana creada");
        actions.openWeek(weekId);
    },
    // NUEVO: AÑADIR SESIÓN MANUAL
    addSessionToWeek: (weekId) => {
        const week = db.weeks[weekId];
        const nextSessionNum = week.sessions.length + 1;
        const sessionId = `Día ${nextSessionNum}`;
        const newSession = {
            session_id: sessionId,
            title: "Nueva Sesión Ad-Hoc",
            goal_summary: "Sesión añadida manualmente",
            session_completion: { status: 'pending', started_at: null, completed_at: null },
            session_notes: "",
            exercises: []
        };
        week.sessions.push(newSession);
        utils.save(db);
        ui.toast("✓ Sesión añadida");
        ui.render();
    },
    createWeekFromImport: (json) => {
        const validated = validate.json(JSON.stringify(json));
        const weekId = validated.week_ref.week_id || utils.uuid();
        validated.week_ref.week_id = weekId;

        const processedSessions = validated.sessions.map(s => ({
            ...s,
            session_completion: s.session_completion || { status: 'pending', started_at: null, completed_at: null },
            session_notes: s.session_notes || "",
            exercises: s.exercises.map(e => ({
                ...e,
                override: null,
                execution: { sets: [] },
                completion: { status: 'pending', completed_at: null },
                notes: ""
            }))
        }));
        
        let newWeekObj = { week: validated.week_ref, sessions: processedSessions, generated_at: validated.generated_at || utils.isoNow() };

        if (db.weeks[weekId]) {
            const existingWeek = db.weeks[weekId];
            newWeekObj = logic.mergeWeeks(existingWeek, newWeekObj);
            ui.toast(`✓ Datos fusionados con Semana ${validated.week_ref.week_number}`);
        } else {
             ui.toast("✓ Nueva semana importada");
        }

        db.weeks[weekId] = newWeekObj;
        utils.save(db);
        return weekId;
    },
    getWeek: (id) => db.weeks[id],
    getSession: (wId, sId) => db.weeks[wId]?.sessions.find(s => s.session_id === sId),
    getExercise: (wId, sId, exId) => logic.getSession(wId, sId)?.exercises.find(e => e.exercise_id === exId),
    getResolvedPlan: (ex) => {
        if (ex.override) {
            const sets = [];
            for (let i = 0; i < ex.override.planned_sets; i++) {
                sets.push({ set_index: i, reps: ex.override.planned_reps, load: ex.override.planned_load, unit: 'kg', source: 'override' });
            }
            return sets;
        }
        if (ex.baseline && ex.baseline.set_plan && Array.isArray(ex.baseline.set_plan)) {
            return ex.baseline.set_plan.map(s => ({ ...s, source: 'baseline' }));
        }
        if (ex.baseline && ex.baseline.planned_sets) {
            const sets = [];
            for(let i=0; i<ex.baseline.planned_sets; i++) {
                sets.push({ set_index: i, reps: ex.baseline.planned_reps, load: ex.baseline.planned_load, unit: 'kg', source: 'baseline_flat'});
            }
            return sets;
        }
        return [];
    },
    startSession: (wId, sId) => {
        const s = logic.getSession(wId, sId);
        if (s.session_completion.status === 'pending') {
            s.session_completion.status = 'in_progress';
            s.session_completion.started_at = utils.isoNow();
            utils.save(db);
            wakeLock.request();
        }
    },
    finishSession: (wId, sId) => {
        const s = logic.getSession(wId, sId);
        s.session_completion.status = 'completed';
        s.session_completion.completed_at = utils.isoNow();
        utils.save(db);
        wakeLock.release();
        return logic.generateReport(wId, sId);
    },
    updateSet: (wId, sId, exId, setIndex, data) => {
        const ex = logic.getExercise(wId, sId, exId);
        while(ex.execution.sets.length <= setIndex) {
            ex.execution.sets.push({ reps: null, load: null, rir: null, notes: "" });
        }
        const set = ex.execution.sets[setIndex];
        if (data.reps !== undefined) set.reps = data.reps;
        if (data.load !== undefined) set.load = data.load;
        if (data.rir !== undefined) set.rir = data.rir;
        if (data.notes !== undefined) set.notes = data.notes;
        set.completed_at = utils.isoNow();
        utils.save(db);
    },
    updateExerciseNote: (wId, sId, exId, text) => {
        const ex = logic.getExercise(wId, sId, exId);
        ex.notes = text;
        utils.save(db);
    },
    updateSessionNote: (wId, sId, text) => {
        const s = logic.getSession(wId, sId);
        s.session_notes = text;
        utils.save(db);
    },
    addSet: (wId, sId, exId) => {
        const ex = logic.getExercise(wId, sId, exId);
        ex.execution.sets.push({ reps: 0, load: 0, rir: null, notes: "", is_extra: true });
        utils.save(db);
        ui.render();
    },
    applyFlatOverride: (wId, sId, exId, sets, reps, load) => {
        try {
            const ex = logic.getExercise(wId, sId, exId);
            const validSets = validate.number(sets, 1, 20, 'Sets');
            const validReps = validate.number(reps, 1, 100, 'Reps');
            const validLoad = validate.number(load, 0, 1000, 'Carga');
            ex.override = { planned_sets: validSets, planned_reps: validReps, planned_load: validLoad };
            utils.save(db);
            ui.toast('✓ Plan actualizado');
            ui.render();
        } catch(e) { }
    },
    toggleComplete: (wId, sId, exId) => {
        const ex = logic.getExercise(wId, sId, exId);
        ex.completion.status = ex.completion.status === 'completed' ? 'pending' : 'completed';
        if(ex.completion.status === 'completed') ex.completion.completed_at = utils.isoNow();
        utils.save(db);
        ui.render();
    },
    addNewExerciseToSession: (wId, sId) => {
        const name = prompt("Nombre del nuevo ejercicio:");
        if(!name || name.trim() === '') return;
        const s = logic.getSession(wId, sId);
        const newEx = {
            exercise_id: utils.uuid(),
            name: name.trim(),
            machine_name: "Ad-hoc",
            baseline: { planned_sets: 3, planned_reps: 10, planned_load: 10 },
            override: null,
            execution: { sets: [] },
            completion: { status: 'pending' },
            notes: ""
        };
        s.exercises.push(newEx);
        utils.save(db);
        ui.render();
        ui.toast("✓ Ejercicio añadido");
    },
    generateReport: (wId, sId) => {
        const w = logic.getWeek(wId);
        const s = logic.getSession(wId, sId);
        return {
            schema_version: "1.0",
            week_ref: w.week,
            session_result: s,
            export_meta: { date: utils.isoNow() }
        };
    },
    deleteWeek: (id) => {
        const w = logic.getWeek(id);
        const hasCompleted = w.sessions.some(s => s.session_completion.status === 'completed');
        if (hasCompleted) {
            if (!confirm(`⚠️ La semana ${w.week.week_number} tiene sesiones completadas.\n\n¿Borrar?`)) return;
        }
        if(confirm(`¿Borrar semana ${w.week.week_number}?`)) {
            delete db.weeks[id];
            utils.save(db);
            actions.goHome();
            ui.toast('✓ Semana eliminada');
        }
    },
    getNextExercise: (wId, sId, currentExId) => {
        const s = logic.getSession(wId, sId);
        const currentIdx = s.exercises.findIndex(e => e.exercise_id === currentExId);
        if (currentIdx === -1 || currentIdx === s.exercises.length - 1) return null;
        return s.exercises[currentIdx + 1];
    }
};

                    const best1RM = analytics.getBest1RM(exName);
                    const history = analytics.getExerciseHistory(exName);
                    const lastSession = history[0];
                    return `
                        <div class="card" onclick="actions.openExerciseHistory('${exName}')">
                            <div class="flex justify-between align-center mb-m">
                                <h3>${exName}</h3>
                                ${best1RM ? `<span class="rm-badge">${best1RM} kg</span>` : ''}
                            </div>
                            <div class="text-small text-muted">
                                ${lastSession ? `Último: ${utils.formatDate(lastSession.date)} - ${lastSession.load}kg × ${lastSession.reps}` : 'Sin datos'}
                            </div>
                            <div class="text-small text-muted mt-m">
                                ${history.length} ${history.length === 1 ? 'serie' : 'series'} registradas
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    },
    renderExerciseHistory: () => {
        const exName = state.historyExercise;
        const records = analytics.get1RMRecords(exName);
        const monthlySummary = analytics.get1RMMonthlySummary(exName);
        const recentSets = analytics.getRecentSets(exName, 30);
        const best1RM = analytics.getBest1RM(exName);

        ui.app.innerHTML = `
            <header>
                <button class="ghost" onclick="actions.openHistory()">← Historial</button>
                <h3>Progreso</h3>
                <button class="icon-btn ghost" onclick="utils.toggleTheme()">${ui.getThemeIcon()}</button>
            </header>
            <div class="container">
                <div class="card">
                    <h2 class="mb-m">${exName}</h2>
                    ${best1RM ? `
                        <div class="flex justify-between align-center mb-m">
                            <span class="text-small text-muted">Mejor 1RM Estimado</span>
                            <span class="rm-badge" style="font-size: 1.1rem;">${best1RM} kg</span>
                        </div>
                    ` : ''}
                </div>
                
                <details class="mb-m" open>
                    <summary>📈 Evolución de 1RM (Récords)</summary>
                    <div class="card mt-m">
                        ${records.length === 0 ? '<p class="text-small text-muted text-center">Sin récords aún</p>' : ''}
                        ${records.map((r, idx) => `
                            <div class="flex justify-between align-center" style="padding: 12px 0; ${idx < records.length - 1 ? 'border-bottom: 1px solid var(--border);' : ''}">
                                <div>
                                    <div class="font-bold">${r.value} kg</div>
                                    <div class="text-small text-muted">${utils.formatDate(r.date)}</div>
                                </div>
                                <div class="text-small">
                                    ${r.load}kg × ${r.reps}
                                    ${r.improvement > 0 ? `<span style="color: var(--accent)"> (+${r.improvement.toFixed(1)})</span>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </details>
                
                <details class="mb-m">
                    <summary>📅 Resumen Mensual (Mejor 1RM)</summary>
                    <div class="card mt-m">
                        ${monthlySummary.length === 0 ? '<p class="text-small text-muted text-center">Sin datos mensuales</p>' : ''}
                        ${monthlySummary.map((m, idx) => `
                            <div class="flex justify-between align-center" style="padding: 12px 0; ${idx < monthlySummary.length - 1 ? 'border-bottom: 1px solid var(--border);' : ''}">
                                <div>
                                    <div class="font-bold">${utils.formatMonth(m.month)}</div>
                                    <div class="text-small text-muted">${utils.formatDate(m.date)}</div>
                                </div>
                                <div class="text-small">
                                    <span class="rm-badge">${m.value} kg</span>
                                    <div class="text-muted">${m.load}kg × ${m.reps}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </details>

                <details class="mb-m" open>
                    <summary>🗓️ Sets Recientes (último mes)</summary>
                    <div class="card mt-m">
                        ${recentSets.length === 0 ? '<p class="text-small text-muted text-center">Sin sets recientes</p>' : ''}
                        <table class="progress-table">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Set</th>
                                    <th>Reps</th>
                                    <th>Kg</th>
                                    <th>1RM</th>
                                    <th>RIR</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${recentSets.map(h => `
                                    <tr>
                                        <td class="text-small">${utils.formatDate(h.date)}</td>
                                        <td>${h.setIndex}</td>
                                        <td><strong>${h.reps}</strong></td>
                                        <td><strong>${h.load}</strong></td>
                                        <td class="text-small text-muted">${h.estimated1RM || '-'}</td>
                                        <td class="text-small">${h.rir !== null ? h.rir : '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </details>

                <div class="card">
                    <h3 class="mb-m">Exportar Histórico Completo</h3>
                    <div class="export-row">
                        <button class="secondary" onclick="actions.exportExerciseCSV('${exName}')">
                            📊 CSV
                        </button>
                        <button class="secondary" onclick="actions.exportExerciseJSON('${exName}')">
                            📄 JSON
                        </button>
                    </div>
                </div>
            </div>
        `;
    },
    renderModal: () => {
        if (state.modal === 'import') {
            ui.app.innerHTML = `
                <div class="modal-overlay" onclick="event.target === this && actions.closeModal()">
                    <div class="modal-content">
                        <h3>Importar JSON</h3>
                        <p class="text-small mb-m">Elige una opción:</p>
                        <button class="primary w-full mb-m" onclick="actions.pasteFromClipboard()">
                            📋 Pegar desde portapapeles
                        </button>
                        <div class="divider">o</div>
                        <div class="file-input-wrapper">
                            <div class="text-small">📂 Seleccionar archivo</div>
                            <input type="file" accept="*/*" id="fileUpload" onchange="actions.handleFileSelect(this)">
                        </div>
                        <div class="divider">o</div>
                        <textarea id="jsonInput" rows="5" placeholder='Pegar JSON aquí...'></textarea>
                        <div class="flex gap-s mt-m">
                            <button class="ghost w-full" onclick="actions.closeModal()">Cancelar</button>
                            <button class="primary w-full" onclick="actions.doImport()">Importar</button>
                        </div>
                    </div>
                </div>`;
        }
        if (state.modal === 'backups') {
            const backupList = backup.list();
            ui.app.innerHTML = `
                <div class="modal-overlay" onclick="event.target === this && actions.closeModal()">
                    <div class="modal-content">
                        <h3>Gestión de Backups</h3>
                        <p class="text-small mb-m">Backups automáticos (últimos 5):</p>
                        ${backupList.length === 0 ? `
                            <div class="card text-center text-muted">
                                No hay backups disponibles.
                            </div>
                        ` : `
                            <button class="secondary w-full mb-m" onclick="backup.downloadAll()">
                                📥 Descargar TODOS los backups
                            </button>
                            <div class="flex-col gap-s mb-m">
                                ${backupList.map(date => `
                                    <div class="card">
                                        <div class="flex justify-between align-center mb-m">
                                            <span class="font-bold">${utils.formatDate(date)}</span>
                                        </div>
                                        <div class="flex gap-s">
                                            <button class="secondary w-full" onclick="backup.restore('${date}')">
                                                Restaurar
                                            </button>
                                            <button class="primary w-full" onclick="backup.download('${date}')">
                                                📥 Bajar
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                        <div class="section-header">Restaurar desde archivo</div>
                        <button class="primary w-full mb-m" onclick="actions.pasteBackupFromClipboard()">
                            📋 Pegar backup desde portapapeles
                        </button>
                        <div class="divider">o</div>
                        <div class="file-input-wrapper">
                            <div class="text-small">📂 Seleccionar archivo backup</div>
                            <input type="file" accept="*/*" id="backupFileUpload" onchange="actions.handleBackupFileSelect(this)">
                        </div>
                        <div class="divider">o</div>
                        <textarea id="backupJsonInput" rows="4" placeholder='Pegar JSON del backup...'></textarea>
                        <div class="flex-col gap-s mt-m mb-m">
                            <button class="primary w-full" onclick="actions.restoreFromBackupJSON('merge')">
                                🔄 Fusionar con Datos Actuales
                                <div class="text-small" style="font-weight:normal; margin-top:2px; opacity:0.9">No borra nada. Suma datos nuevos.</div>
                            </button>
                            <button class="danger w-full" onclick="actions.restoreFromBackupJSON('replace')">
                                ⚠️ Sobrescribir Todo
                                <div class="text-small" style="font-weight:normal; margin-top:2px; opacity:0.9">Borra datos actuales y pone el backup.</div>
                            </button>
                        </div>
                        <button class="ghost w-full" onclick="actions.closeModal()">Cerrar</button>
                    </div>
                </div>`;
        }
        if (state.modal === 'export_all_rms') {
            const exercises = analytics.getAllExercises();
            const totalExercises = exercises.length;
            ui.app.innerHTML = `
                <div class="modal-overlay" onclick="event.target === this && actions.closeModal()">
                    <div class="modal-content">
                        <h3>Exportar Todos los 1RM</h3>
                        <p class="text-small mb-m">${totalExercises} ejercicios encontrados</p>
                        <div class="card">
                            <h3 class="mb-m">Formato</h3>
                            <div class="flex-col gap-s">
                                <button class="primary w-full" onclick="actions.downloadAll1RMsJSON()">
                                    📄 JSON Completo
                                    <div class="text-small" style="font-weight: normal; margin-top: 4px;">
                                        Incluye todos los récords y resumen mensual
                                    </div>
                                </button>
                                <button class="secondary w-full" onclick="actions.downloadAll1RMsCSV()">
                                    📊 CSV Resumen
                                    <div class="text-small" style="font-weight: normal; margin-top: 4px;">
                                        Tabla con mejores marcas por ejercicio
                                    </div>
                                </button>
                            </div>
                        </div>
                        <button class="ghost w-full mt-m" onclick="actions.closeModal()">
                            Cancelar
                        </button>
                    </div>
                </div>`;
        }
    },
    renderSetModal: () => {
        const { wId, sId, exId, setIndex, currentReps, currentLoad } = state.setModal;
        const ex = logic.getExercise(wId, sId, exId);
        const set = ex.execution.sets[setIndex] || { reps: null, load: null, rir: null, notes: "" };
        const planArr = logic.getResolvedPlan(ex);
        const totalSets = planArr.length;
        
        // Prioridad: 1. Valor pasado (lo que escribiste) 2. Valor en BD 3. Vacío
        const reps = currentReps !== undefined ? currentReps : (set.reps || '');
        const load = currentLoad !== undefined ? currentLoad : (set.load || '');

        ui.app.innerHTML = `
            <div class="modal-overlay" onclick="event.target === this && actions.closeSetModal()">
                <div class="modal-content">
                    <h3>✓ Guardar Set ${setIndex + 1} de ${totalSets}</h3>
                    <div class="card mt-m">
                        <div class="flex gap-s mb-m">
                            <div class="flex-col w-full">
                                <label class="text-small text-muted mb-m">Reps</label>
                                <input id="modal_reps" type="number" inputmode="numeric" value="${reps}">
                            </div>
                            <div class="flex-col w-full">
                                <label class="text-small text-muted mb-m">Carga (kg)</label>
                                <input id="modal_load" type="number" inputmode="decimal" step="0.5" value="${load}">
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <label class="text-small text-muted mb-m display-block">¿Cuántas repeticiones te quedaban? (RIR)</label>
                        <div class="rir-selector">
                            <button class="rir-btn ${(set.rir !== null && set.rir !== undefined) ? (set.rir === 0 ? 'selected' : '') : (lastRIR === 0 ? 'selected' : '')}" onclick="actions.selectRIR(0)">0</button>
                            <button class="rir-btn ${(set.rir !== null && set.rir !== undefined) ? (set.rir === 1 ? 'selected' : '') : (lastRIR === 1 ? 'selected' : '')}" onclick="actions.selectRIR(1)">1</button>
                            <button class="rir-btn ${(set.rir !== null && set.rir !== undefined) ? (set.rir === 2 ? 'selected' : '') : (lastRIR === 2 ? 'selected' : '')}" onclick="actions.selectRIR(2)">2</button>
                            <button class="rir-btn ${(set.rir !== null && set.rir !== undefined) ? (set.rir === 3 ? 'selected' : '') : (lastRIR === 3 ? 'selected' : '')}" onclick="actions.selectRIR(3)">3</button>
                            <button class="rir-btn ${(set.rir !== null && set.rir !== undefined) ? (set.rir === 4 ? 'selected' : '') : (lastRIR === 4 ? 'selected' : '')}" onclick="actions.selectRIR(4)">4+</button>
                        </div>
                        <div class="flex justify-between text-small text-muted" style="margin-top: 8px;">
                            <span>Fallo</span>
                            <span>Reserva</span>
                        </div>
                    </div>
                    <div class="card">
                        <label class="text-small text-muted mb-m display-block">Nota (opcional)</label>
                        <textarea id="modal_notes" rows="2" placeholder="Técnica, sensaciones...">${set.notes || ''}</textarea>
                    </div>
                    <div class="flex-col gap-s mt-m">
                        <button class="primary w-full" onclick="actions.saveSetWithRIR()">
                            ✓ Guardar
                        </button>
                        <button class="ghost w-full" onclick="actions.saveSetWithoutRIR()">
                            Guardar sin RIR
                        </button>
                    </div>
                </div>
            </div>
        `;
    }
};

const actions = {
    goHome: () => {
        state.view = 'home';
        state.activeWeekId = null;
        state.activeSessionId = null;
        state.activeExerciseId = null;
        wakeLock.release();
        ui.render();
    },
    openWeek: (id) => {
        state.activeWeekId = id;
        state.view = 'week';
        ui.render();
    },
    openSession: (id) => {
        state.activeSessionId = id;
        state.view = 'session';
        logic.startSession(state.activeWeekId, id);
        ui.render();
    },
    openExercise: (id) => {
        state.activeExerciseId = id;
        state.view = 'exercise';
        ui.render();
    },
    openHistory: () => {
        state.view = 'history';
        ui.render();
    },
    openExerciseHistory: (exerciseName) => {
        state.historyExercise = exerciseName;
        state.view = 'exercise_history';
        ui.render();
    },
    openImport: () => {
        state.modal = 'import';
        ui.render();
    },
    openBackups: () => {
        state.modal = 'backups';
        ui.render();
    },
    closeModal: () => {
        state.modal = null;
        ui.render();
    },
    // Captura valores antes de cambiar la vista (mantiene pre-carga)
    openSetModal: (wId, sId, exId, setIndex) => {
        const repsInput = document.getElementById(`reps_${setIndex}`);
        const loadInput = document.getElementById(`load_${setIndex}`);
        const currentReps = repsInput ? repsInput.value : undefined;
        const currentLoad = loadInput ? loadInput.value : undefined;

        state.setModal = { wId, sId, exId, setIndex, currentReps, currentLoad };
        ui.render();
    },
    closeSetModal: () => {
        state.setModal = null;
        ui.render();
    },
    selectRIR: (value) => {
        document.querySelectorAll('.rir-btn').forEach(btn => btn.classList.remove('selected'));
        event.target.classList.add('selected');
        state.selectedRIR = value;
        lastRIR = value; 
    },
    saveSetWithoutRIR: () => {
        const { wId, sId, exId, setIndex } = state.setModal;
        const reps = document.getElementById('modal_reps').value;
        const load = document.getElementById('modal_load').value;
        const notes = document.getElementById('modal_notes').value;

        if (!reps || !load) {
            ui.toast('⚠️ Completa reps y carga');
            return;
        }
        
        logic.updateSet(wId, sId, exId, setIndex, {
            reps: parseFloat(reps),
            load: parseFloat(load),
            rir: null,
            notes: notes
        });
        state.setModal = null;
        ui.toast('✓ Set guardado');
        ui.render();
    },
    saveSetWithRIR: () => {
        const { wId, sId, exId, setIndex } = state.setModal;
        const reps = document.getElementById('modal_reps').value;
        const load = document.getElementById('modal_load').value;
        const notes = document.getElementById('modal_notes').value;
        const selectedBtn = document.querySelector('.rir-btn.selected');
        const rir = selectedBtn ? parseInt(selectedBtn.textContent) : null;
        
        if (!reps || !load) {
            ui.toast('⚠️ Completa reps y carga');
            return;
        }
        
        logic.updateSet(wId, sId, exId, setIndex, {
            reps: parseFloat(reps),
            load: parseFloat(load),
            rir: rir,
            notes: notes
        });
        state.setModal = null;
        ui.toast('✓ Set guardado');
        ui.render();
    },
    pasteFromClipboard: async () => {
        try {
            const text = await navigator.clipboard.readText();
            if (!text || text.trim() === '') {
                ui.toast('⚠️ Portapapeles vacío');
                return;
            }
            document.getElementById('jsonInput').value = text;
            ui.toast('✓ Pegado');
        } catch(err) {
            ui.toast('⚠️ No se pudo acceder al portapapeles');
        }
    },
    pasteBackupFromClipboard: async () => {
        try {
            const text = await navigator.clipboard.readText();
            if (!text || text.trim() === '') {
                ui.toast('⚠️ Portapapeles vacío');
                return;
            }
            document.getElementById('backupJsonInput').value = text;
            ui.toast('✓ Pegado');
        } catch(err) {
            ui.toast('⚠️ No se pudo acceder al portapapeles');
        }
    },
    handleFileSelect: (input) => {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('jsonInput').value = e.target.result;
            ui.toast("✓ Archivo cargado");
        };
        reader.onerror = () => ui.toast("⚠️ Error al leer archivo");
        reader.readAsText(file);
    },
    handleBackupFileSelect: (input) => {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('backupJsonInput').value = e.target.result;
            ui.toast("✓ Archivo cargado");
        };
        reader.onerror = () => ui.toast("⚠️ Error al leer archivo");
        reader.readAsText(file);
    },
    doImport: () => {
        try {
            const val = document.getElementById('jsonInput').value;
            if(!val.trim()) {
                ui.toast("⚠️ Contenido vacío");
                return;
            }
            const json = validate.json(val);
            const res = logic.createWeekFromImport(json);
            if (res) {
                state.modal = null;
                actions.openWeek(res);
            }
        } catch(e) {
            ui.toast(`⚠️ ${e.message}`);
        }
    },
    // Se ha modificado para aceptar 'mode' (merge/replace)
    restoreFromBackupJSON: (mode) => {
        const val = document.getElementById('backupJsonInput').value;
        if(!val.trim()) {
            ui.toast("⚠️ Contenido vacío");
            return;
        }
        backup.restoreFromJSON(val, mode);
    },
    finishSession: () => {
        const s = logic.getSession(state.activeWeekId, state.activeSessionId);
        const incomplete = s.exercises.filter(e => e.completion.status !== 'completed');
        if (incomplete.length > 0) {
            if (!confirm(`⚠️ Hay ${incomplete.length} ejercicio(s) sin completar.\n\n¿Finalizar?`)) return;
        }
        if(confirm("✓ ¿Finalizar sesión?")) {
            logic.finishSession(state.activeWeekId, state.activeSessionId);
            actions.viewReport();
        }
    },
    viewReport: () => {
        const data = logic.generateReport(state.activeWeekId, state.activeSessionId);
        utils.download(data, `report_${state.activeSessionId}_${new Date().toISOString().split('T')[0]}.json`);
        ui.toast("✓ Reporte descargado");
        actions.goHome();
    },
    exportWeek: () => {
        const w = logic.getWeek(state.activeWeekId);
        utils.download(w, `week_${w.week.week_number}_${new Date().toISOString().split('T')[0]}.json`);
        ui.toast("✓ Semana exportada");
    },
    exportExerciseCSV: (exerciseName) => {
        const csv = analytics.exportToCSV(exerciseName);
        if (!csv) {
            ui.toast('⚠️ No hay datos para exportar');
            return;
        }
        utils.downloadCSV(csv, `${exerciseName.replace(/\s+/g, '_')}_history.csv`);
        ui.toast('✓ CSV exportado');
    },
    exportExerciseJSON: (exerciseName) => {
        const data = analytics.exportToJSON(exerciseName);
        utils.download(data, `${exerciseName.replace(/\s+/g, '_')}_history.json`);
        ui.toast('✓ JSON exportado');
    },
    exportAllRMs: () => {
        state.modal = 'export_all_rms';
        ui.render();
    },
    downloadAll1RMsJSON: () => {
        const data = analytics.exportAll1RMs();
        const today = new Date().toISOString().split('T')[0];
        utils.download(data, `all_1RMs_${today}.json`);
        ui.toast(`✓ ${data.total_exercises} ejercicios exportados`);
        actions.closeModal();
    },
    downloadAll1RMsCSV: () => {
        const csv = analytics.exportAll1RMsCSV();
        const today = new Date().toISOString().split('T')[0];
        utils.downloadCSV(csv, `all_1RMs_summary_${today}.csv`);
        ui.toast('✓ CSV exportado');
        actions.closeModal();
    }
};

// GESTIÓN NATIVA BOTÓN ATRÁS (Android)
const initAppListeners = async () => {
    if (window.Capacitor) {
        const { App } = Capacitor.Plugins;
        await App.addListener('backButton', ({ canGoBack }) => {
            if (state.modal || state.setModal) {
                actions.closeModal(); actions.closeSetModal(); return;
            }
            switch (state.view) {
                case 'exercise': actions.openSession(state.activeSessionId); break;
                case 'session': actions.openWeek(state.activeWeekId); break;
                case 'week': case 'history': actions.goHome(); break;
                case 'home': App.exitApp(); break;
                default: actions.goHome();
            }
        });
    }
};

initAppListeners();
utils.initTheme();
ui.render();
console.log('%c Strength Tracker v6.6 (CRUD + Merge)', 'background: #10b981; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold;');
</script>
</body>
</html>
